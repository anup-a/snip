<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 700px at 15% 10%,#8fb4ff 0%,transparent 60%),radial-gradient(900px 700px at 90% 90%,#b18cff 0%,transparent 60%),linear-gradient(135deg,#5d7cf5,#7a5cf0 60%,#3f3fb8)}
.menubar{height:30px;display:flex;align-items:center;padding:0 16px;gap:20px;font-size:13.5px;color:#fff;background:rgba(20,20,60,.18);backdrop-filter:blur(20px)}
.menubar b{font-weight:700}.menubar .r{margin-left:auto;display:flex;gap:16px}
.win{position:absolute;background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(20,10,80,.45),0 0 0 .5px rgba(0,0,0,.2);overflow:hidden}
.bar{height:44px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid #eceef2;background:#f7f8fa}
.dot{width:12px;height:12px;border-radius:6px}.t{margin-left:14px;font-size:13px;color:#555;font-weight:600}
.side{position:absolute;top:44px;left:0;bottom:0;width:190px;background:#f7f8fa;border-right:1px solid #eceef2;padding:16px 10px;font-size:13px;color:#444}
.side div{padding:7px 10px;border-radius:7px;margin-bottom:2px}.side .on{background:#e6edff;color:#2458e6;font-weight:600}
.main{position:absolute;top:44px;left:190px;right:0;bottom:0;padding:26px 30px}
h1{font-size:24px;font-weight:700;color:#1f2329;letter-spacing:-.3px}.sub{color:#8a8f99;font-size:13px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.card{border:1px solid #eceef2;border-radius:12px;padding:16px}.k{font-size:12px;color:#8a8f99}.v{font-size:26px;font-weight:700;margin-top:-3px;color:#1f2329}
.up{color:#1aa35a;font-size:12px;font-weight:600;margin-top:13px}.dn{color:#e5484d;font-size:12px;font-weight:600;margin-top:13px}
.chart{margin-top:18px;border:1px solid #eceef2;border-radius:12px;padding:16px;height:250px;position:relative}
.bars{position:absolute;left:20px;right:20px;bottom:20px;height:170px;display:flex;align-items:flex-end;gap:14px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#5b8cff,#3370ff)}
.bars i.hl{background:linear-gradient(#ff9b6b,#f5613b)}
.note{margin-top:16px;border-radius:12px;background:#f7f8fa;padding:14px 16px;font-size:13px;line-height:1.55;color:#3b3f46}
.chat .msg{display:flex;gap:10px;margin:14px 0}.av{width:34px;height:34px;border-radius:17px;flex:none}
.bub{background:#f2f4f7;border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.5;color:#1f2329;max-width:520px}
.me{justify-content:flex-end}.me .bub{background:#3370ff;color:#fff}
.nm{font-size:12px;color:#8a8f99;margin-bottom:3px}
code{background:#fff3f0;color:#d4380d;border-radius:5px;padding:1px 6px;font-size:12.5px}
.chead{position:absolute;top:12px;left:30px;display:flex;gap:10px;align-items:baseline;font-size:15px;color:#1f2329}.chead span{font-size:12.5px;color:#8a8f99}
.priv{width:454px;white-space:nowrap}.priv .ic{width:16px;height:16px;vertical-align:-3px;margin-right:9px}
</style></head><body>

</script></body></html>
